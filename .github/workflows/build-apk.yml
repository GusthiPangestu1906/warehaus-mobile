name: CI/CD - Test & Build APK (Develop)

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch: # Memungkinkan trigger manual dari GitHub Actions UI

jobs:
  test-and-build:
    name: Test & Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java Development Kit
      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      # 3. Setup Flutter Environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # 4. Handle .env (karena .env terdaftar di pubspec.yaml assets)
      - name: Create .env file
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          else
            echo "API_URL=https://staging.api.warehaus.com" > .env
          fi

      # 5. Install Dependencies (Workspace / Monorepo)
      - name: Install Dependencies
        run: flutter pub get

      # 6. Analisis Kode (Linter & Static Analysis)
      #    --no-fatal-infos  = info tidak gagalkan build
      #    --no-fatal-warnings = warning tidak gagalkan build (hanya error yang gagalkan)
      - name: Run Flutter Analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # 7. Eksekusi Unit & Widget Tests
      - name: Run Unit & Widget Tests
        run: flutter test

      # 8. Build APK (Hanya jika lolos test & analisa kode)
      - name: Build APK
        run: flutter build apk --debug

      # 9. Upload APK sebagai GitHub Actions Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: warehaus-mobile-develop-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

