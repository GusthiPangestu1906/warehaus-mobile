name: mobile
description: "Warehouse Management System — Platform operasional gudang: inbound, put-away, picking, packing, shipping, dan utilisasi ruang gudang."
publish_to: "none"
version: 2.0.1+6

workspace:
  - packages/core_ui
  - packages/core_services
  - packages/zone
  - packages/product
  - packages/dashboard
  - packages/outbound
  - packages/inbound
  - packages/auth

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.0.0
  flutter_launcher_icons: ^0.13.1

  core_ui:
    path: packages/core_ui
  core_services:
    path: packages/core_services
  zone:
    path: packages/zone
  product:
    path: packages/product
  dashboard:
    path: packages/dashboard
  outbound:
    path: ./packages/outbound
  inbound:
    path: packages/inbound
  auth:
    path: packages/auth
  flutter_dotenv: ^6.0.1
  percent_indicator: ^4.2.5
  mobile_scanner: ^7.2.0
  flutter_slidable: ^4.0.3
  flutter_bloc: ^9.1.1
  gal: ^2.3.2
  path_provider: ^2.1.5
  get_it: ^9.2.1
  intl: ^0.20.2
  flutter_native_splash: ^2.4.7
  dartz: ^0.10.1
  camera: ^0.12.0+1
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  melos: ^7.5.1
  flutter_staggered_grid_view: ^0.6.2

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icon/app_icon.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/app_icon.png

  android_12:
    image: assets/icon/app_icon.png
    color: "#FFFFFF"

  fullscreen: true

melos:
  scripts:
    analyze:
      description: "Run Flutter analyzer across all workspace packages"
      run: dart run melos exec -- "flutter analyze"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
